name: Sanitization check

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  banned-terms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for personal/business names, real IDs, and credentials
        run: |
          set +e
          grep -rniE "REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED|REDACTED" --exclude-dir=.git .
          if [ $? -eq 0 ]; then
            echo "::error::Banned term found in repo contents — see matches above."
            exit 1
          fi
          echo "Clean — no banned terms found."
